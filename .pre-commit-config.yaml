repos:
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/pylint
    rev: v3.3.6
    hooks:
      - id: pylint
        args: [src/, tests/]
        pass_filenames: false
        additional_dependencies:
          - fastapi
          - uvicorn
          - slowapi
          - httpx
          - pydantic

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
