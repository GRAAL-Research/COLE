name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  HF_USERNAME: davebulaval
  HF_SPACE_NAME: cole

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "ci@colebenchmark.org"
          git config user.name "COLE CI"
          git lfs install
          # Create a fresh orphan branch with LFS configured for large files
          # Orphan approach avoids LFS issues with large .jsonl files in git history
          git checkout --orphan hf-deploy
          # Setup LFS tracking for large files before adding
          git lfs track "*.jsonl"
          git lfs track "*.pdf"
          # Exclude files not needed for the HF Space deployment
          rm -rf .github/ tests/ predictions/ .pylintrc CONTRIBUTING.md .env.example
          git add -A
          git commit -m "deploy to HF Space"
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf-deploy:main
