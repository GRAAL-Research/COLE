name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  HF_USERNAME: davebulaval
  HF_SPACE_NAME: cole

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup Git LFS for HF and push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install
          # Track files that HF might consider large
          git lfs track "*.pdf" "*.bin" "*.h5" "*.pt" "*.safetensors" "*.onnx" "*.parquet" "*.pkl"
          git lfs track "package-lock.json"
          # Commit .gitattributes if changed
          git add .gitattributes
          git diff --cached --quiet .gitattributes || git commit -m "configure git lfs for HF spaces"
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME ${{ github.ref_name }}:main
