name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  HF_USERNAME: davebulaval
  HF_SPACE_NAME: cole

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to HF Space with LFS migration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "ci@colebenchmark.org"
          git config user.name "COLE CI"
          git lfs install
          # Migrate any large files in history to LFS
          git lfs migrate import --include="*.jsonl,*.pdf" --everything --yes
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME ${{ github.ref_name }}:main
