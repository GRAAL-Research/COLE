name: Tests

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            src/requirements.txt
            tests/tests_requirements.txt
      - name: Install dependencies
        run: |
          pip install -Ur src/requirements.txt
          pip install -Ur tests/tests_requirements.txt
      - name: Test with pytest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            # Dependabot PRs (and forks) cannot access secrets; HF-gated tests are skipped,
            # so the project-wide coverage threshold cannot be met. Disable it for these runs.
            pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=0
          else
            pytest --cov=src --cov-report=term-missing --cov-report=xml
          fi
      - name: Deploy coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          pip install genbadge[coverage]
          genbadge coverage -i coverage.xml -o /tmp/coverage-badge.svg
          git config user.email "ci@colebenchmark.org"
          git config user.name "COLE CI"
          # Switch to badges branch (create orphan if it doesn't exist)
          if git rev-parse --verify origin/badges >/dev/null 2>&1; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . 2>/dev/null || true
          fi
          cp /tmp/coverage-badge.svg .
          git add coverage-badge.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
