version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "Github actions dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "pip dependencies"
    allow:
      - dependency-type: direct
      - dependency-type: indirect

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "npm dependencies"
    ignore:
      # eslint 10 needs eslint-plugin-react 8+, which eslint-config-next does
      # not yet pull in. Re-enable once the next ecosystem catches up.
      - dependency-name: "eslint"
        versions: [">=10"]
